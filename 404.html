  <title>Page not found — Umar Ilyas</title>
  <style>
    :root{color-scheme:dark;--bg:#080a10;--text:#f2f3fb;--muted:#a3a8b8;--violet:#9785ff;--cyan:#69d8d0;--line:rgba(210,218,255,.14)}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 75% 20%,rgba(96,88,180,.16),transparent 38%),var(--bg);color:var(--text);font:16px/1.65 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,660px);padding:clamp(28px,7vw,60px);border:1px solid var(--line);border-radius:22px;background:rgba(14,17,26,.9);box-shadow:0 30px 90px rgba(0,0,0,.35)}.eyebrow{font:11px/1.4 ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--cyan)}h1{margin:18px 0 12px;font-size:clamp(40px,9vw,72px);line-height:1;letter-spacing:-.07em}.gradient{background:linear-gradient(95deg,#a28cff,#68ddd2);color:transparent;background-clip:text}p{max-width:470px;color:var(--muted)}a{display:inline-flex;margin-top:18px;padding:12px 17px;border:1px solid rgba(151,133,255,.65);border-radius:9px;background:var(--violet);color:#10101b;font-weight:700;text-decoration:none}a:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
  </style>
</head>
<body><main class="card"><span class="eyebrow">404 / Page not found</span><h1>That page<br><span class="gradient">isn’t here.</span></h1><p>The link may be out of date or the page may have moved. Head back to the portfolio to explore the available projects and prototypes.</p><a href="/">Return to the portfolio →</a></main></body>
